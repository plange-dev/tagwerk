<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tagwerk – Kalender</title>
<meta name="theme-color" content="#F5EFE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15120F" media="(prefers-color-scheme: dark)">
<meta name="description" content="Tagwerk – dein Kalender für Android und PC">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
@font-face{font-family:"Bricolage Grotesque";font-weight:500;font-style:normal;font-display:swap;src:url(fonts/bricolage-500.woff2) format("woff2")}
@font-face{font-family:"Bricolage Grotesque";font-weight:700;font-style:normal;font-display:swap;src:url(fonts/bricolage-700.woff2) format("woff2")}
@font-face{font-family:"Bricolage Grotesque";font-weight:800;font-style:normal;font-display:swap;src:url(fonts/bricolage-800.woff2) format("woff2")}
@font-face{font-family:"DM Sans";font-weight:400;font-style:normal;font-display:swap;src:url(fonts/dmsans-400.woff2) format("woff2")}
@font-face{font-family:"DM Sans";font-weight:500;font-style:normal;font-display:swap;src:url(fonts/dmsans-500.woff2) format("woff2")}
@font-face{font-family:"DM Sans";font-weight:600;font-style:normal;font-display:swap;src:url(fonts/dmsans-600.woff2) format("woff2")}
@font-face{font-family:"DM Sans";font-weight:700;font-style:normal;font-display:swap;src:url(fonts/dmsans-700.woff2) format("woff2")}
:root{
  --bg:#F5EFE6;--panel:#FFFCF6;--ink:#221C16;--muted:#7D7366;--line:#E6DCCD;--soft:#EEE6D8;
  --accent:#D4552C;--accent-soft:#F7DED2;--ok:#2FA27A;--warn:#D99A2B;
  --shadow:0 18px 50px rgba(70,45,20,.18);--display:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--body:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--r:16px;--H:52px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#15120F;--panel:#1F1A15;--ink:#F3ECE1;--muted:#A3977F;--line:#332B22;--soft:#2A231C;
  --accent:#F07A4D;--accent-soft:#3D261B;--shadow:0 18px 50px rgba(0,0,0,.5)}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.4 "DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:var(--safe-area-inset-top,env(safe-area-inset-top)) var(--safe-area-inset-right,env(safe-area-inset-right)) var(--safe-area-inset-bottom,env(safe-area-inset-bottom)) var(--safe-area-inset-left,env(safe-area-inset-left));-webkit-tap-highlight-color:transparent;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:288px 1fr;height:100vh;height:100dvh}
/* Sidebar */
aside{background:var(--panel);border-right:1px solid var(--line);padding:22px 20px;overflow:auto;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.03em}
.brand svg{flex:none}
.brand em{font-style:normal;color:var(--accent)}
.side-title{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
/* Ein-/ausklappbare Bereiche */
.sec>.side-title{cursor:pointer;user-select:none;justify-content:flex-start;border-radius:8px;padding:4px 2px;margin-left:-2px}
.sec>.side-title:hover{color:var(--ink)}
.sec>.side-title:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sec>.side-title::before{content:"";width:6px;height:6px;border:solid currentColor;border-width:0 2px 2px 0;transform:rotate(45deg) translateY(-2px);margin:0 10px 0 3px;transition:transform .15s;flex:none}
.sec.collapsed>.side-title::before{transform:rotate(-45deg)}
.sec.collapsed>:not(.side-title){display:none!important}
.sec.collapsed>.side-title{margin-bottom:0}
.sec>.side-title button{margin-left:auto}
#devsec{display:flex;flex-direction:column;gap:22px}
#devsec:empty,#notifsec:empty{display:none}
.side-title button{border:0;background:none;color:var(--accent);font-weight:700;font-size:12px;letter-spacing:0;text-transform:none;cursor:pointer;padding:4px}
.cal-item{display:flex;align-items:center;gap:10px;padding:7px 6px;border-radius:10px;cursor:pointer;user-select:none}
.cal-item:hover{background:var(--soft)}
.cal-box{width:18px;height:18px;border-radius:6px;border:2px solid var(--c);display:grid;place-items:center;flex:none}
.cal-item.on .cal-box{background:var(--c)}
.cal-item.on .cal-box::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.cal-item span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-item .edit{opacity:.0;border:0;background:none;color:var(--muted);cursor:pointer;padding:2px 4px;border-radius:6px}
.cal-item:hover .edit{opacity:1}
@media (hover:none){.cal-item .edit{opacity:1}}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px}
.sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.verbtn{border:0;background:none;padding:2px 0;text-align:left;font-size:11.5px;color:var(--muted);cursor:pointer;font-variant-numeric:tabular-nums}
.verbtn:hover{color:var(--ink)}
.verbadge{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;margin-left:4px;vertical-align:1px}
.verbadge.nightly{background:#F7E3B5;color:#7A5200}
.verbadge.release{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.ok i{background:var(--ok)} .status.warn i{background:var(--warn)}
/* mini month */
.mini-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.mini-head b{font-family:var(--display);font-size:15px}
.mini-head button{border:0;background:none;cursor:pointer;color:var(--muted);font-size:18px;width:28px;height:28px;border-radius:8px}
.mini-head button:hover{background:var(--soft)}
.mini{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:12px}
.mini .h{color:var(--muted);font-weight:600;font-size:10.5px;padding:3px 0}
.mini .d{height:30px;display:grid;place-items:center;border-radius:9px;cursor:pointer;position:relative}
.mini .d:hover{background:var(--soft)}
.mini .d.out{color:var(--muted);opacity:.55}
.mini .d.today{color:var(--accent);font-weight:700}
.mini .d.sel{background:var(--ink);color:var(--panel);font-weight:700}
.mini .d.has::after{content:"";position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--accent)}
.mini .d.sel.has::after{background:var(--panel)}
/* Main */
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:10px;padding:14px 20px 10px;flex-wrap:wrap}
.period{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.02em;margin:0;flex:1;min-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.period small{font-family:var(--body);font-weight:500;font-size:13px;color:var(--muted);margin-left:8px;letter-spacing:0}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:inline-grid;place-items:center;cursor:pointer;flex:none}
.icon-btn:hover{border-color:var(--muted)}
.pill{height:38px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-weight:600;cursor:pointer}
.pill:hover{border-color:var(--muted)}
.menu-btn{display:none}
.seg{display:inline-flex;background:var(--soft);border-radius:13px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:0 14px;height:32px;border-radius:10px;color:var(--muted);font-weight:600;cursor:pointer}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.search{display:flex;align-items:center;gap:6px;height:38px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:0 10px;width:200px}
.search input{border:0;background:none;outline:none;width:100%;min-width:0}
.search button{border:0;background:none;color:var(--muted);cursor:pointer;display:none;padding:0}
.search.has button{display:block}
/* Quick add */
.quickwrap{padding:0 20px 12px}
.quick{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 6px 6px 14px;transition:border-color .15s,box-shadow .15s}
.quick:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.quick input{flex:1;border:0;background:none;outline:none;min-width:0;height:34px}
.quick button{border:0;background:var(--accent);color:#fff;font-weight:700;height:34px;padding:0 14px;border-radius:10px;cursor:pointer}
.quick button:disabled{opacity:.4;cursor:default}
.qa-prev{font-size:13px;color:var(--muted);padding:6px 4px 0;min-height:0;display:none;gap:8px;flex-wrap:wrap}
.qa-prev.show{display:flex}
.qa-prev b{color:var(--ink)}
.tag{background:var(--soft);padding:2px 8px;border-radius:999px}
#view{flex:1;min-height:0;overflow:auto;position:relative;overscroll-behavior:contain}
/* Month */
.month{display:grid;grid-template-columns:34px repeat(7,minmax(0,1fr));margin:0 20px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mh{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:10px 8px 8px}
.kw{font-size:10.5px;color:var(--muted);border-top:1px solid var(--line);text-align:center;padding-top:10px;background:var(--bg)}
.cell{border-top:1px solid var(--line);border-left:1px solid var(--line);min-height:108px;padding:6px 6px 4px;cursor:pointer;min-width:0;transition:background .1s}
.cell:hover{background:color-mix(in srgb,var(--soft) 55%,transparent)}
.cell.we{background:color-mix(in srgb,var(--soft) 35%,transparent)}
.cell.out .num{color:var(--muted);opacity:.6}
.num{font-weight:600;font-size:13px;width:26px;height:26px;display:grid;place-items:center;border-radius:9px}
.cell.today .num{background:var(--accent);color:#fff}
.cell.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.hol{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:1px 2px}
.chip{display:flex;gap:6px;align-items:center;font-size:12px;padding:2px 6px;border-radius:7px;white-space:nowrap;overflow:hidden;margin-top:2px;line-height:1.35}
.chip:hover{background:var(--soft)}
.chip i{width:7px;height:7px;border-radius:50%;flex:none;background:var(--c)}
.chip span{overflow:hidden;text-overflow:ellipsis}
.chip time{color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.chip.ad{background:var(--c);color:#fff;font-weight:600}
.chip.ad:hover{filter:brightness(1.05);background:var(--c)}
.more{font-size:11.5px;color:var(--muted);padding:1px 6px;font-weight:600}
.dots{display:none}
/* Day panel */
.daypanel{margin:16px 20px 90px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.dp-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.dp-head h2{font-family:var(--display);font-size:19px;margin:0;letter-spacing:-.01em}
.dp-head button{white-space:nowrap;flex:none;border:0;background:var(--accent-soft);color:var(--accent);font-weight:700;padding:8px 12px;border-radius:10px;cursor:pointer}
.agenda-item{display:grid;grid-template-columns:62px 4px 1fr;gap:12px;align-items:stretch;padding:10px 4px;border-radius:12px;cursor:pointer}
.agenda-item:hover{background:var(--soft)}
.agenda-item time{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);padding-top:1px;line-height:1.35}
.agenda-item time b{display:block;color:var(--ink);font-weight:600}
.agenda-item .bar{border-radius:4px;background:var(--c)}
.agenda-item .t{font-weight:600}
.agenda-item .s{font-size:13px;color:var(--muted)}
.agenda-item.holi{cursor:default}.agenda-item.holi:hover{background:none}
.empty{color:var(--muted);padding:14px 4px}
/* Time grid */
.tg{margin:0 20px 90px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.tg-head{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);border-radius:var(--r) var(--r) 0 0}
.tg-row{display:grid}
.tg-day{text-align:center;padding:10px 2px 8px;cursor:pointer;min-width:0}
.tg-day span{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tg-day b{display:inline-grid;place-items:center;font-family:var(--display);font-size:20px;width:36px;height:36px;border-radius:11px;margin-top:2px}
.tg-day.today b{background:var(--accent);color:#fff}
.tg-day.sel:not(.today) b{background:var(--soft)}
.tg-ad{border-top:1px solid var(--line)}
.tg-ad .lbl{font-size:10px;color:var(--muted);text-align:right;padding:6px 6px 0 0}
.adcol{border-left:1px solid var(--line);padding:3px 2px;min-height:28px;min-width:0;cursor:pointer}
.adchip{font-size:11.5px;font-weight:600;color:#fff;background:var(--c);border-radius:6px;padding:2px 6px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.adchip.holi{background:var(--soft);color:var(--muted);cursor:default}
.tg-body{display:grid;position:relative}
.gutter{position:relative;height:calc(var(--H)*24)}
.gutter div{position:absolute;right:8px;font-size:10.5px;color:var(--muted);transform:translateY(-50%);font-variant-numeric:tabular-nums}
.tg-col{position:relative;height:calc(var(--H)*24);border-left:1px solid var(--line);cursor:cell;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(color-mix(in srgb,var(--line) 45%,transparent) 1px,transparent 1px);
  background-size:100% var(--H),100% var(--H);background-position:0 0,0 calc(var(--H)/2);min-width:0}
.tg-col.today{background-color:color-mix(in srgb,var(--accent-soft) 35%,transparent)}
.blk{position:absolute;border-radius:8px;padding:3px 6px;font-size:12px;overflow:hidden;cursor:pointer;
  background:color-mix(in srgb,var(--c) 20%,var(--panel));border-left:3px solid var(--c);line-height:1.3;box-shadow:0 0 0 1px var(--panel)}
.blk:hover{background:color-mix(in srgb,var(--c) 30%,var(--panel))}
.blk b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk span{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.now{position:absolute;left:-1px;right:0;height:2px;background:var(--accent);z-index:3;pointer-events:none}
.now::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
/* List */
.list{margin:0 20px 90px}
.list h3{font-family:var(--display);font-size:15px;margin:18px 4px 4px;display:flex;gap:8px;align-items:baseline}
.list h3 small{color:var(--muted);font-family:var(--body);font-weight:500;font-size:12.5px}
.list h3.today{color:var(--accent)}
.list .box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:4px 8px}
/* FAB */
.fab{position:fixed;right:calc(22px + var(--safe-area-inset-right,env(safe-area-inset-right)));bottom:calc(22px + var(--safe-area-inset-bottom,env(safe-area-inset-bottom)));width:58px;height:58px;border-radius:19px;border:0;background:var(--accent);color:#fff;box-shadow:0 10px 26px color-mix(in srgb,var(--accent) 45%,transparent);cursor:pointer;display:grid;place-items:center;z-index:20;transition:transform .15s}
.fab:hover{transform:translateY(-2px)}
/* Modal */
.overlay{position:fixed;inset:0;background:rgba(20,12,5,.42);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .15s}
.overlay[hidden]{display:none}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.sheet{background:var(--panel);border-radius:22px;width:min(480px,100%);max-height:calc(100dvh - 40px);overflow:auto;box-shadow:var(--shadow);padding:0 18px 18px;animation:up .2s ease-out}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:0;background:var(--panel);padding:14px 0 10px;z-index:2}
.sheet-head h3{margin:0;font-family:var(--display);font-size:17px}
/* Fenster: Knöpfe unten im Daumenbereich (Variante D) */
.sheet-head{justify-content:center;padding-top:18px}
.sheet-head>span{display:none}
.sheet.has-foot{padding-bottom:0}
.sheet-foot{position:sticky;bottom:0;display:flex;gap:10px;margin:12px -18px 0;padding:12px 18px calc(12px + var(--safe-area-inset-bottom,env(safe-area-inset-bottom)));background:var(--panel);border-top:1px solid var(--line);z-index:3}
.sheet-foot button{flex:1;height:50px;border-radius:14px;font-weight:700;font-size:16px;cursor:pointer;border:0;font-family:inherit;color:var(--ink);background:var(--soft)}
.sheet-foot .save{background:var(--accent);color:#fff;flex:1.4}
.sheet-foot button:disabled{opacity:.6;cursor:default}
@media (max-width:760px){
  .overlay{align-items:flex-end;padding:calc(10px + var(--safe-area-inset-top,env(safe-area-inset-top))) 0 0}
  .sheet{width:100%;max-width:none;border-radius:26px 26px 0 0;max-height:calc(100dvh - 10px - var(--safe-area-inset-top,env(safe-area-inset-top)));padding-bottom:calc(18px + var(--safe-area-inset-bottom,env(safe-area-inset-bottom)))}
  .sheet.has-foot{padding-bottom:0}
  .sheet-head{padding-top:24px}
  .sheet-head::before{content:"";position:absolute;top:9px;left:50%;width:40px;height:5px;border-radius:3px;background:var(--line);transform:translateX(-50%)}
}
@media (min-width:761px){
  .overlay{padding:calc(20px + var(--safe-area-inset-top,env(safe-area-inset-top))) 20px calc(20px + var(--safe-area-inset-bottom,env(safe-area-inset-bottom)))}
  .sheet{max-height:calc(100dvh - 40px - var(--safe-area-inset-top,env(safe-area-inset-top)) - var(--safe-area-inset-bottom,env(safe-area-inset-bottom)))}
  .sheet-foot{padding-bottom:14px;border-radius:0 0 22px 22px}
}
.link{border:0;background:none;color:var(--muted);font-weight:600;cursor:pointer;padding:6px 2px}
.link.strong{color:var(--accent);font-weight:700}
.big{width:100%;font-family:var(--display);font-size:22px;font-weight:700;border:0;border-bottom:2px solid var(--line);background:none;padding:8px 2px;outline:none;margin-bottom:14px}
.big:focus{border-color:var(--accent)}
.group{background:var(--bg);border-radius:14px;margin-bottom:12px;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;min-height:48px}
.row+.row{border-top:1px solid var(--line)}
.row>span{font-weight:500;flex:none}
.row input[type=date],.row input[type=time],.row select{border:0;background:var(--panel);border-radius:9px;padding:6px 9px;outline:none;max-width:100%}
.row select{padding-right:4px}
.dt{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.group>input,.group>textarea{display:block;width:100%;border:0;background:none;padding:13px 14px;outline:none;resize:vertical}
.group>textarea{border-top:1px solid var(--line)}
.calpick{display:flex;align-items:center;gap:8px}
.calpick i{width:12px;height:12px;border-radius:50%;background:var(--c)}
.switch{appearance:none;width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;transition:background .15s;flex:none;margin:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch:checked{background:var(--ok)}
.switch:checked::after{transform:translateX(18px)}
.hint{font-size:12.5px;color:var(--muted);margin:2px 4px 12px}
.danger{width:100%;border:0;background:color-mix(in srgb,#D9443F 12%,transparent);color:#D9443F;font-weight:700;padding:12px;border-radius:12px;cursor:pointer}
.choice{display:flex;flex-direction:column;gap:8px;padding-top:6px}
.choice button{border:0;padding:13px;border-radius:12px;font-weight:700;cursor:pointer;background:var(--bg)}
.choice button.red{color:#D9443F}
.swatches{display:flex;flex-wrap:wrap;gap:10px;padding:12px 14px}
.swatches button{width:32px;height:32px;border-radius:10px;border:0;background:var(--c);cursor:pointer;outline-offset:2px}
.swatches button.on{outline:3px solid var(--ink)}
/* Navigation */
.navbtn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:700;font-size:13px;color:var(--accent);background:var(--accent-soft);border-radius:10px;padding:6px 10px;white-space:nowrap}
.navbtn svg{flex:none}
.agenda-item{grid-template-columns:62px 4px 1fr auto}
.agenda-item .navbtn{align-self:center;padding:8px}
.navrow{display:flex;gap:8px;flex-wrap:wrap;padding:0 14px 12px}
.navrow .navbtn{padding:9px 12px}
.navrow .navbtn.alt{background:var(--soft);color:var(--ink)}
.opt-btn{width:100%;text-align:left;border:0;background:none;padding:8px 6px;border-radius:10px;cursor:pointer;font-weight:500}
.opt-btn:hover{background:var(--soft)}
.group>textarea.mono{font:12px/1.4 ui-monospace,monospace;border-top:0}
/* Handy-Kalender */
.side-note{font-size:12.5px;color:var(--muted);margin:0 6px 10px;line-height:1.45}
.acct{font-size:11px;font-weight:600;color:var(--muted);margin:10px 6px 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill.wide{width:100%;background:var(--accent);color:#fff;border:0}
.dev-err{font-size:12px;color:#D9443F;margin:6px}
.row select:disabled,.row input:disabled{opacity:.5}
/* Mehrfachauswahl Erinnerungen */
#r-remind{border-top:1px solid var(--line)}
.rsel{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 12px}
.rchip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);line-height:1.2}
.rchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.rsum{color:var(--muted);font-size:13px;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-rsel{padding:2px 6px 8px}
.side-rsel .rchip{font-size:12px;padding:5px 9px}
/* Toast */
.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-area-inset-bottom,env(safe-area-inset-bottom)));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:11px 16px;border-radius:13px;font-size:14px;z-index:200;box-shadow:var(--shadow);display:flex;gap:14px;align-items:center;max-width:calc(100vw - 32px);animation:up .2s}
.toast button{border:0;background:none;color:var(--accent);font-weight:700;cursor:pointer;padding:0}
.scrim{display:none}
/* Responsive */
@media (max-width:980px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;top:0;bottom:0;left:0;width:min(320px,86vw);z-index:60;transform:translateX(-105%);transition:transform .25s ease;box-shadow:var(--shadow);padding-top:calc(22px + var(--safe-area-inset-top,env(safe-area-inset-top)))}
  body.drawer aside{transform:none}
  /* Statusleiste über der geöffneten Seitenleiste abdecken */
  body.drawer::before{content:"";position:fixed;left:0;top:0;width:min(320px,86vw);height:var(--safe-area-inset-top,env(safe-area-inset-top));background:var(--panel);z-index:61}
  body.drawer .scrim{display:block;position:fixed;inset:0;background:rgba(20,12,5,.35);z-index:55}
  .menu-btn{display:inline-grid}
}
@media (max-width:760px){
  .top{padding:10px 14px 8px;gap:8px}
  .period{font-size:20px;order:1;min-width:0}
  .period small{display:none}
  .menu-btn{order:0}
  .top .nav{order:2}
  .seg{order:3;width:100%;display:flex}
  .seg button{flex:1;padding:0 6px}
  .search{order:4;width:100%}
  .quickwrap{padding:0 14px 10px}
  .quick button{padding:0 11px}
  .month{margin:0 10px;grid-template-columns:repeat(7,minmax(0,1fr))}
  .kw,.mh.kwh{display:none}
  .cell{min-height:58px;padding:5px 2px;text-align:center}
  .num{margin:0 auto}
  .chips,.more,.hol{display:none}
  .dots{display:flex;gap:3px;justify-content:center;margin-top:4px;flex-wrap:wrap;padding:0 2px}
  .dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}
  .daypanel,.tg,.list{margin-left:10px;margin-right:10px}
  .tg-day b{font-size:16px;width:30px;height:30px}
  .tg-day span{font-size:10px;letter-spacing:.04em}
  .blk{padding:2px 3px;font-size:11px}
  .blk span{display:none}
  :root{--H:46px}
}
</style>

<body>
<div class="app">
  <aside id="side">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect x="2" y="5" width="26" height="23" rx="7" fill="var(--accent)"/><rect x="2" y="5" width="26" height="8" rx="4" fill="var(--ink)" opacity=".9"/><circle cx="10" cy="20" r="2.4" fill="#fff"/><circle cx="15" cy="20" r="2.4" fill="#fff" opacity=".6"/><circle cx="20" cy="20" r="2.4" fill="#fff" opacity=".35"/><rect x="8" y="2" width="3" height="6" rx="1.5" fill="var(--ink)"/><rect x="19" y="2" width="3" height="6" rx="1.5" fill="var(--ink)"/></svg>
      <span>Tag<em>werk</em></span>
    </div>
    <div id="mini"></div>
    <div class="sec" data-sec="cals">
      <div class="side-title">Kalender <button data-act="addcal">+ Neu</button></div>
      <div id="cals"></div>
    </div>
    <div id="devsec"></div>
    <div id="notifsec"></div>
    <div class="sec" data-sec="opt">
      <div class="side-title">Optionen</div>
      <label class="opt"><span>Feiertage (Deutschland)</span><input type="checkbox" class="switch" id="opt-hol"></label>
      <button class="opt-btn" data-act="backup">⤓ Backup erstellen</button>
      <button class="opt-btn" data-act="restore">⤒ Backup einspielen</button>
      <button class="opt-btn" data-act="import">📥 Kalender importieren (.ics / .zip)</button>
      <button class="opt-btn" data-act="export">📤 Kalender exportieren (.ics)</button>
    </div>
    <div class="sidefoot">
      <div class="status" id="status"><i></i><span>Lädt…</span></div>
      <button class="verbtn" id="verbtn" data-act="version">Version wird ermittelt…</button>
    </div>
  </aside>
  <div class="scrim" data-act="closedrawer"></div>
  <main>
    <div class="top">
      <button class="icon-btn menu-btn" data-act="drawer" aria-label="Menü"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
      <h1 class="period" id="period"></h1>
      <div class="nav" style="display:flex;gap:6px">
        <button class="icon-btn" data-act="prev" aria-label="Zurück"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button class="pill" data-act="today">Heute</button>
        <button class="icon-btn" data-act="next" aria-label="Weiter"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
      <div class="seg" id="seg">
        <button data-act="view" data-v="month">Monat</button>
        <button data-act="view" data-v="week">Woche</button>
        <button data-act="view" data-v="day">Tag</button>
        <button data-act="view" data-v="list">Liste</button>
      </div>
      <label class="search" id="searchbox"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="color:var(--muted);flex:none"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="search" placeholder="Suchen" autocomplete="off"><button type="button" data-act="clearsearch" aria-label="Suche leeren">✕</button></label>
    </div>
    <div class="quickwrap">
      <div class="quick">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="var(--accent)" aria-hidden="true"><path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z" opacity=".6"/></svg>
        <input id="qa" placeholder="Schnell eintragen – z. B. „Freitag 15 Uhr Zahnarzt“" autocomplete="off" enterkeyhint="done">
        <button id="qa-go" disabled>Eintragen</button>
      </div>
      <div class="qa-prev" id="qa-prev"></div>
    </div>
    <div id="view"></div>
  </main>
</div>
<button class="fab" data-act="new" aria-label="Neuer Termin"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<div class="overlay" id="modal" hidden></div>

<script>
(function(){
"use strict";
/* ---------- Helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const pad=n=>String(n).padStart(2,"0");
const DAY=86400000;
const MONTHS=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const MON_SHORT=["Jan.","Feb.","März","Apr.","Mai","Juni","Juli","Aug.","Sep.","Okt.","Nov.","Dez."];
const WD_SHORT=["Mo","Di","Mi","Do","Fr","Sa","So"];
const WD_LONG=["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const hm=d=>pad(d.getHours())+":"+pad(d.getMinutes());
const toLocal=d=>ymd(d)+"T"+hm(d);
function parseLocal(s){const [a,b="00:00"]=String(s).split("T");const [y,m,d]=a.split("-").map(Number);const [h,mi]=b.split(":").map(Number);return new Date(y,(m||1)-1,d||1,h||0,mi||0);}
const startOfDay=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const wdIndex=d=>(d.getDay()+6)%7;
const startOfWeek=d=>addDays(startOfDay(d),-wdIndex(d));
const sameDay=(a,b)=>a&&b&&ymd(a)===ymd(b);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=(t.getUTCDay()+6)%7;t.setUTCDate(t.getUTCDate()-n+3);const f=new Date(Date.UTC(t.getUTCFullYear(),0,4));return 1+Math.round(((t-f)/DAY-3+((f.getUTCDay()+6)%7))/7);}
const fmtDayLong=d=>`${WD_LONG[wdIndex(d)]}, ${d.getDate()}. ${MONTHS[d.getMonth()]}`;
const uid=()=>"e"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const isNative=()=>!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
const isAndroid=()=>/android/i.test(navigator.userAgent);
/* Native Plugins: Die App stellt sie unter Capacitor.Plugins bereit (ohne @capacitor/core gibt es kein registerPlugin) */
function nativePlugin(name){
  const C=window.Capacitor;
  if(!C||!isNative())return null;
  if(C.Plugins&&C.Plugins[name])return C.Plugins[name];
  if(typeof C.registerPlugin==="function"){try{return C.registerPlugin(name);}catch(e){}}
  return null;
}
/* Google-Kalender für die Web-/PC-Version: OAuth-Client-ID aus der Google Cloud Console (Typ „Webanwendung“) */
const GOOGLE_CLIENT_ID="";
const FRAMED=(()=>{try{return window.self!==window.top;}catch(e){return true;}})();
const googleAvailable=()=>!!GOOGLE_CLIENT_ID&&!FRAMED&&!isNative()&&(location.protocol==="https:"||location.hostname==="localhost");
const provLabel=()=>isNative()?"Handy-Kalender":"Google Kalender";
const provMark=()=>isNative()?"📱 ":"☁ ";
const mapsUrl=loc=>"https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(loc)+"&travelmode=driving";
const geoUrl=loc=>"geo:0,0?q="+encodeURIComponent(loc);
const NAV_ICON='<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.7 2.3a1 1 0 0 0-1.06-.23l-18 7a1 1 0 0 0 .08 1.9l7.6 2.1 2.1 7.6a1 1 0 0 0 1.9.08l7-18a1 1 0 0 0-.22-1.05z"/></svg>';
function navBtn(loc,compact){return `<a class="navbtn" href="${esc(mapsUrl(loc))}" target="_blank" rel="noopener" data-act="nav" title="Route zu ${esc(loc)}" aria-label="Navigation zu ${esc(loc)} starten">${NAV_ICON}${compact?"":"Navigation starten"}</a>`;}
function lsGet(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

/* ---------- State ---------- */
const DEFAULT_CALS=[
  {id:"privat",name:"Privat",color:"#E0703A",visible:true},
  {id:"arbeit",name:"Arbeit",color:"#3B7DD8",visible:true},
  {id:"familie",name:"Familie",color:"#2FA27A",visible:true},
  {id:"sport",name:"Sport",color:"#9A5BD3",visible:true}];
const SWATCHES=["#E0703A","#D9443F","#E3A72F","#8BAA3A","#2FA27A","#2A9DB5","#3B7DD8","#6366D1","#9A5BD3","#D55A9B","#8A7B6A"];
const today0=()=>startOfDay(new Date());
const prefs=lsGet("tagwerk:prefs")||{};
const state={
  view:["month","week","day","list"].includes(prefs.view)?prefs.view:"month",
  cursor:today0(), selected:today0(), mini:new Date(today0().getFullYear(),today0().getMonth(),1),
  events:new Map(), cals:DEFAULT_CALS.map(c=>({...c})), holidays:true, search:"", lastCal:prefs.lastCal||null
};
const DEV_KEY="tagwerk:device";
state.dev=Object.assign({enabled:false,show:{}},lsGet(DEV_KEY)||{},{cals:[],events:[],byKey:new Map(),from:null,to:null,loading:false,error:null});
const H=()=>parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--H"))||52;

/* ---------- Storage (cloud via db, otherwise local) ---------- */
const S={mode:"loading",evCol:null,setRef:null,chain:new Map()};
function queue(key,fn){const prev=S.chain.get(key)||Promise.resolve();const p=prev.catch(()=>{}).then(fn);S.chain.set(key,p);return p;}
async function withRetry(fn){try{return await fn();}catch(e){if(e&&e.code==="unavailable"){await sleep(500+Math.random()*900);return fn();}throw e;}}
function writeError(e){
  const c=e&&e.code;
  if(c==="invalid_argument")toast("Speichern nicht möglich – dir fehlen Schreibrechte für diesen Kalender.");
  else if(c==="quota_exceeded")toast("Der Speicher ist voll. Lösche alte Termine, um neue anzulegen.");
  else toast("Speichern fehlgeschlagen. Bitte versuche es später erneut.");
}
function setStatus(text,kind){const el=$("#status");el.className="status "+(kind||"");el.querySelector("span").textContent=text;}
function localSave(){lsSet("tagwerk:data",{events:[...state.events.values()],cals:state.cals,holidays:state.holidays});}
function goLocal(){
  S.mode="local";
  const d=lsGet("tagwerk:data");
  if(d){ if(Array.isArray(d.events))state.events=new Map(d.events.map(e=>[e.id,e])); if(Array.isArray(d.cals)&&d.cals.length)state.cals=d.cals; state.holidays=d.holidays!==false; }
  setStatus("Auf diesem Gerät gespeichert – Backup unter Optionen","ok"); render();
}
async function initStore(){
  let c=window.claude;
  const framed=(()=>{try{return window.self!==window.top;}catch(e){return true;}})();
  if(framed&&!isNative())for(let i=0;i<20&&!(c&&c.use);i++){await sleep(150);c=window.claude;}
  if(!(c&&c.use))return goLocal();
  let db=null,user=null,id=null;
  try{[db,user]=await Promise.all([c.use("db"),c.use("user")]);}catch(e){}
  try{id=user?await user.id():null;}catch(e){}
  if(!db||!id)return goLocal();
  S.mode="cloud";
  S.evCol=db.doc("data/users/"+id+"/cal").collection("events");
  S.setRef=db.doc("data/users/"+id+"/settings");
  setStatus("Synchronisiere…");
  const timer=setTimeout(()=>setStatus("Server noch nicht erreichbar – Anzeige evtl. veraltet","warn"),10000);
  S.evCol.onSnapshot(snap=>{
    const m=new Map();
    snap.docs.forEach(d=>{const x=d.data();if(x)m.set(d.id,Object.assign(JSON.parse(JSON.stringify(x)),{id:d.id}));});
    state.events=m;
    if(!snap.metadata.fromCache){clearTimeout(timer);setStatus("Synchronisiert – auf all deinen Geräten","ok");}
    render();
  },()=>{clearTimeout(timer);setStatus("Synchronisation unterbrochen – bitte neu öffnen","warn");});
  S.setRef.onSnapshot(s=>{
    if(s.exists){const d=s.data()||{};if(Array.isArray(d.cals)&&d.cals.length)state.cals=JSON.parse(JSON.stringify(d.cals));state.holidays=d.holidays!==false;}
    render();
  },()=>{});
}
function saveEvent(ev){
  state.events.set(ev.id,ev); render();
  if(S.mode==="cloud"){const body=JSON.parse(JSON.stringify(ev));delete body.id;queue(ev.id,()=>withRetry(()=>S.evCol.doc(ev.id).set(body))).catch(writeError);}
  else localSave();
}
function saveEventsBulk(list){
  for(const ev of list)state.events.set(ev.id,ev);
  render();
  if(S.mode==="cloud"){for(const ev of list){const body=JSON.parse(JSON.stringify(ev));delete body.id;queue(ev.id,()=>withRetry(()=>S.evCol.doc(ev.id).set(body))).catch(writeError);}}
  else localSave();
}
function deleteEvent(id){
  state.events.delete(id); render();
  if(S.mode==="cloud")queue(id,()=>withRetry(()=>S.evCol.doc(id).delete())).catch(writeError);
  else localSave();
}
function saveSettings(){
  render();
  if(S.mode==="cloud"){const body=JSON.parse(JSON.stringify({cals:state.cals,holidays:state.holidays}));queue("settings",()=>withRetry(()=>S.setRef.set(body))).catch(writeError);}
  else localSave();
}
function savePrefs(){lsSet("tagwerk:prefs",{view:state.view,lastCal:state.lastCal});}

/* ---------- Calendars & holidays ---------- */
const calOf=id=>{
  const S=srcOfCal(id);
  if(S)return S.st.cals.find(c=>c.id===id)||{id,name:S.label(),color:"#8A7B6A",device:true,writable:false};
  return state.cals.find(c=>c.id===id)||state.cals[0];
};
const colorOf=id=>(calOf(id)||{}).color||"#888";
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451);const mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da);}
const hcache={};
function holidaysOf(y){
  if(hcache[y])return hcache[y];
  const E=easter(y);
  return hcache[y]=[[new Date(y,0,1),"Neujahr"],[addDays(E,-2),"Karfreitag"],[addDays(E,1),"Ostermontag"],[new Date(y,4,1),"Tag der Arbeit"],[addDays(E,39),"Christi Himmelfahrt"],[addDays(E,50),"Pfingstmontag"],[new Date(y,9,3),"Tag der Deutschen Einheit"],[new Date(y,11,25),"1. Weihnachtstag"],[new Date(y,11,26),"2. Weihnachtstag"]];
}

/* ---------- Occurrences (with repeats) ---------- */
function nth(s,rep,i){
  if(rep==="daily")return addDays(s,i);
  if(rep==="weekly")return addDays(s,7*i);
  if(rep==="monthly"){const d=new Date(s.getFullYear(),s.getMonth()+i,s.getDate(),s.getHours(),s.getMinutes());return d.getDate()===s.getDate()?d:null;}
  if(rep==="yearly"){const d=new Date(s.getFullYear()+i,s.getMonth(),s.getDate(),s.getHours(),s.getMinutes());return d.getMonth()===s.getMonth()?d:null;}
  return i===0?s:null;
}
function occurrences(from,to){
  const out=[];
  const hidden=new Set(state.cals.filter(c=>c.visible===false).map(c=>c.id));
  for(const ev of state.events.values()){
    const cal=calOf(ev.cal); if(!cal||hidden.has(cal.id))continue;
    const s=parseLocal(ev.start); let e=parseLocal(ev.end);
    const allDay=!!ev.allDay;
    const spanDays=allDay?Math.max(1,Math.round((startOfDay(e)-startOfDay(s))/DAY)+1):0;
    let dur=e-s; if(!allDay&&dur<=0)dur=30*60000;
    const endOf=st=>allDay?addDays(startOfDay(st),spanDays):new Date(st.getTime()+dur);
    const rep=ev.repeat||"none";
    const ex=new Set(ev.exdates||[]);
    const until=(rep!=="none"&&ev.until)?addDays(parseLocal(ev.until),1):null;
    let i=0;
    if(rep==="daily"||rep==="weekly"){const step=rep==="daily"?1:7;i=Math.max(0,Math.floor((from-s-(endOf(s)-s))/(step*DAY))-1);}
    else if(rep==="monthly"){i=Math.max(0,(from.getFullYear()-s.getFullYear())*12+from.getMonth()-s.getMonth()-2);}
    else if(rep==="yearly"){i=Math.max(0,from.getFullYear()-s.getFullYear()-1);}
    for(let n=0;n<2000;n++,i++){
      const cur=nth(s,rep,i);
      if(rep==="none"&&i>0)break;
      if(!cur)continue;
      if(cur>=to)break;
      if(until&&cur>=until)break;
      const ce=endOf(cur);
      if(ce>from&&!ex.has(ymd(cur)))out.push({ev,start:cur,end:ce,allDay,color:cal.color,title:ev.title||"Ohne Titel",key:ev.id+"@"+ymd(cur)});
      if(rep==="none")break;
    }
  }
  for(const S of srcList()){
    if(!S.st.enabled)continue;
    for(const inst of S.st.events){

  let trav=old?(old.device?travelFlag(old.src,old.device):effTravel(old)):(opts.draft&&opts.draft.travel!==undefined?!!opts.draft.travel:state.notif.defTravel);
  const sumText=()=>remSummary(rem)+(trav&&!f("f-allday").checked?" + Fahrzeit":"");
  const fillRemind=()=>{
    const ad=f("f-allday").checked;
    if((!old&&!remTouched&&!(opts.draft&&opts.draft.remind!==undefined))||rem==null)rem=defRemind(ad);
    const list=(ad?REMIND_AD:REMIND_T).filter(x=>x[0]!==null).slice();
    for(const m of rem)if(!list.some(x=>x[0]===m))list.push([m,remindLabel(m)]);
    f("f-remind").innerHTML=list.map(([v,l])=>`<button type="button" class="rchip ${rem.includes(v)?"on":""}" data-m="${v}">${l}</button>`).join("")
      +(ad?"":`<button type="button" class="rchip travel ${trav?"on":""}" data-travel="1">🚗 Fahrzeit</button>`);
    f("f-rsum").textContent=sumText();
    travelInfo();
  };
  let travT=null,travSeq=0;
  const travelInfo=()=>{
    const el=f("f-travelinfo");if(!el)return;
    const ad=f("f-allday").checked,loc=f("f-loc").value.trim();
    clearTimeout(travT);
    if(!trav||ad){el.style.display="none";return;}
    el.style.display="";
    if(!loc){el.textContent="🚗 Trage einen Ort ein – dann rechnet Tagwerk die Fahrzeit aus.";return;}
    el.textContent="🚗 Berechne Fahrzeit…";
    const seq=++travSeq;
    travT=setTimeout(async()=>{
      try{const r=await travelFor(loc);if(seq!==travSeq)return;
        el.textContent=`🚗 Fahrzeit ca. ${fmtMin(r.min)} (${TMODE[state.travel.mode]||"Auto"} ab ${state.travel.gps?"aktuellem Standort":"Start"}) → Erinnerung ${fmtMin(r.rounded)} vorher`;}
      catch(e){if(seq===travSeq)el.textContent="🚗 "+errText(e);}
    },700);
  };
  f("f-remind").onclick=e=>{
    const b=e.target.closest(".rchip");if(!b)return;
    if(b.dataset.travel){trav=!trav;b.classList.toggle("on",trav);f("f-rsum").textContent=sumText();travelInfo();return;}
    const m=+b.dataset.m;remTouched=true;
    rem=rem.includes(m)?rem.filter(x=>x!==m):normRem(rem.concat(m));
    b.classList.toggle("on",rem.includes(m));
    f("f-rsum").textContent=sumText();
  };
  f("r-remind").style.display=isNative()?"":"none";
  f("f-loc").value=src.location||"";f("f-notes").value=src.notes||"";
  const sync=()=>{
    fillRemind();
    const ad=f("f-allday").checked;
    modal.querySelectorAll(".tm").forEach(x=>x.style.display=ad?"none":"");
    f("r-until").style.display=f("f-rep").value==="none"?"none":"";
    f("f-calc").style.setProperty("--c",colorOf(f("f-cal").value));
  };
  const navSync=()=>{const l=f("f-loc").value.trim();f("f-nav").style.display=l?"":"none";f("f-nav").innerHTML=l?navBtn(l)+(isNative()&&isAndroid()?`<a class="navbtn alt" href="${esc(geoUrl(l))}" data-act="nav">Andere Navi-App</a>`:""):"";};
  navSync();f("f-loc").addEventListener("input",()=>{navSync();travelInfo();});
  sync();
  f("f-allday").onchange=()=>{if(!f("f-allday").checked&&f("f-st").value==="00:00"){f("f-st").value="09:00";f("f-et").value="10:00";}sync();};
  f("f-rep").onchange=sync;f("f-cal").onchange=sync;
  let prevStart=parseLocal(f("f-sd").value+"T"+(f("f-st").value||"00:00"));
  const shift=()=>{
    if(!f("f-sd").value)return;
    const ns=parseLocal(f("f-sd").value+"T"+(f("f-st").value||"00:00"));
    const oe=parseLocal(f("f-ed").value+"T"+(f("f-et").value||"00:00"));
    const ne=new Date(oe.getTime()+(ns-prevStart));
    if(!isNaN(ne)){f("f-ed").value=ymd(ne);f("f-et").value=hm(ne);}
    prevStart=ns;
  };
  f("f-sd").onchange=shift;f("f-st").onchange=shift;
  if(!old)setTimeout(()=>f("f-title").focus(),60);
  f("evform").onsubmit=ev=>{
    ev.preventDefault();
    const ad=f("f-allday").checked;
    const sd=f("f-sd").value,ed=f("f-ed").value||sd;
    if(!sd){f("f-sd").focus();return;}
    let ns=parseLocal(sd+"T"+(ad?"00:00":(f("f-st").value||"09:00")));
    let ne=parseLocal(ed+"T"+(ad?"00:00":(f("f-et").value||"10:00")));
    if(ne<ns)ne=ad?new Date(ns):new Date(ns.getTime()+3600000);
    const repv=f("f-rep").value;
    const out={
      id:old?old.id:uid(),
      title:f("f-title").value.trim()||"Ohne Titel",
      allDay:ad,start:toLocal(ns),end:toLocal(ne),
      cal:f("f-cal").value,repeat:repv,until:repv!=="none"?f("f-until").value:"",
      ...(isNative()?{remind:normRem(rem||[]),travel:!!trav}:(old&&old.remind!==undefined&&!old.device?{remind:old.remind,travel:old.travel}:{})),
      location:f("f-loc").value.trim(),notes:f("f-notes").value.trim(),
      exdates:old&&old.exdates?[...old.exdates]:[],
      created:old&&old.created?old.created:Date.now(),updated:Date.now()
    };
    state.lastCal=out.cal;savePrefs();
    closeModal();
    if((old&&old.device)||srcOfCal(out.cal)){deviceSave(old,out);return;}
    saveEvent(out);
    if(!old){state.selected=startOfDay(ns);toast("Termin gesichert");}
  };
  if(old)f("f-del").onclick=()=>old.device?askDeleteDevice(old):askDelete(old,opts.date);
}
function askDelete(ev,occDate){

/* ---------- Synchronisierte Quellen (Handy-Konten/Google und CalDAV) ---------- */
let _devP=null;
function devPlugin(){
  if(_devP)return _devP;
  const C=window.Capacitor;
  if(!C||!isNative()){if(googleAvailable())_devP=GoogleCal;return _devP;}
  _devP=nativePlugin("CapacitorCalendar");
  if(!_devP&&C.Plugins)_devP=C.Plugins.CapacitorCalendar||null;
  return _devP;
}
function normColor(c){
  if(!c||typeof c!=="string")return null;
  if(/^#[0-9a-f]{8}$/i.test(c)){if(c.slice(1,3)==="00")return null;return "#"+c.slice(3);}
  return /^#[0-9a-f]{6}$/i.test(c)?c:null;
}
const errText=e=>(e&&(e.message||e.errorMessage))||"Unbekannter Fehler";

const SOURCES={};
function mkSource(key,o){
  const st=Object.assign({enabled:false,show:{}},lsGet(o.prefsKey)||{},{cals:[],events:[],byKey:new Map(),from:null,to:null,loading:false,error:null,needAuth:false});
  return SOURCES[key]=Object.assign({key,st},o);
}
const srcList=()=>Object.values(SOURCES);
const srcOfCal=id=>typeof id==="string"?srcList().find(S=>id.startsWith(S.calPfx))||null:null;
const srcOfInst=k=>typeof k==="string"?srcList().find(S=>k.startsWith(S.instPfx))||null:null;
const srcWritable=S=>S.st.enabled&&S.P()?S.st.cals.filter(c=>c.writable):[];
const allWritable=()=>srcList().flatMap(srcWritable);
const devWritable=allWritable;
function srcSavePrefs(S){lsSet(S.prefsKey,{enabled:S.st.enabled,show:S.st.show});}

mkSource("dev",{calPfx:"dev:",instPfx:"d:",prefsKey:DEV_KEY,P:devPlugin,
  label:()=>provLabel(),mark:()=>provMark(),title:()=>isNative()?"Handy-Konten":"Google-Konto",
  colorOf:inst=>normColor(inst.color),
  calColor:c=>normColor(c.color)});
mkSource("dav",{calPfx:"dav:",instPfx:"c:",prefsKey:"tagwerk:dav",P:()=>DavCal.configured()?DavCal:null,
  label:()=>DavCal.accountName()||"CalDAV",mark:()=>"🌐 ",title:()=>"CalDAV-Konto",
  colorOf:()=>null,
  calColor:c=>{const x=c.color;if(!x||typeof x!=="string")return null;if(/^#[0-9a-f]{8}$/i.test(x))return x.slice(0,7);return /^#[0-9a-f]{6}$/i.test(x)?x:null;}});
state.dev=SOURCES.dev.st;

async function srcConnect(S){
  if(S.key==="dav"){openDavForm();return;}
  const P=S.P();
  if(!P){toast(isNative()?"Kalender-Zugriff ist nicht verfügbar.":"Die Google-Verbindung ist noch nicht eingerichtet.");return;}
  try{
    const r=await P.requestFullCalendarAccess();
    if(r&&r.result==="granted"){
      S.st.enabled=true;S.st.needAuth=false;srcSavePrefs(S);
      await srcLoadCals(S);srcReload(S);
      toast(S.label()+" verbunden");
    }else toast(isNative()?"Ohne Kalender-Zugriff geht es nicht. Erlauben unter Einstellungen → Apps → Tagwerk → Berechtigungen.":"Google hat den Zugriff nicht erlaubt.");
  }catch(e){toast("Verbinden fehlgeschlagen: "+errText(e));}
}
function srcDisconnect(S){
  openModal(`<div class="sheet"><div class="sheet-head"><span></span><h3>${esc(S.label())} trennen?</h3><span></span></div>
    <p class="hint">Die Termine dieses Kontos werden in Tagwerk nicht mehr angezeigt. Im Konto selbst bleibt alles erhalten.${S.key==="dav"?" Die Zugangsdaten werden von diesem Gerät gelöscht.":""}</p>
    <div class="choice"><button class="red" id="dd-yes">Trennen</button><button data-close>Abbrechen</button></div></div>`);
  $("#dd-yes",modal).onclick=()=>{
    closeModal();
    if(S.key==="dev"&&!isNative())GoogleCal.signOut();
    if(S.key==="dav")DavCal.forget();
    Object.assign(S.st,{enabled:false,events:[],byKey:new Map(),from:null,to:null,cals:[],error:null,needAuth:false});
    if(srcOfCal(state.lastCal)===S){state.lastCal=null;savePrefs();}
    srcSavePrefs(S);render();
  };
}
async function srcLoadCals(S){
  const P=S.P();if(!P)return;
  try{
    const r=await P.listCalendars();
    S.st.cals=(r&&r.result||[]).map(c=>({id:S.calPfx+c.id,rawId:String(c.id),name:c.title||c.internalTitle||"Kalender",account:c.accountName||"",color:S.calColor(c)||"#8A7B6A",writable:c.allowsContentModifications!==false,device:true,sysVisible:c.visible!==false,src:S.key}))
      .sort((a,b)=>a.account.localeCompare(b.account)||a.name.localeCompare(b.name));
    for(const c of S.st.cals)if(!(c.id in S.st.show))S.st.show[c.id]=c.sysVisible;
    srcSavePrefs(S);S.st.error=null;S.st.needAuth=false;
  }catch(e){if(e&&e.needAuth)S.st.needAuth=true;S.st.error=e&&e.needAuth?null:"Kalender konnten nicht gelesen werden: "+errText(e);}
}
function srcReload(S){(S?[S]:srcList()).forEach(x=>{x.st.from=null;x.st.to=null;});render();}
const devReload=()=>srcReload();
function srcEnsureView(){
  const c=state.cursor;
  const from=addDays(startOfWeek(new Date(c.getFullYear(),c.getMonth(),1)),-7);
  const mini=startOfWeek(state.mini);
  for(const S of srcList())if(S.st.enabled&&S.P())srcEnsure(S,from<mini?from:mini,addDays(from,56));
}
async function srcEnsure(S,from,to){
  const d=S.st;
  if(d.loading)return;
  if(d.from&&from>=d.from&&to<=d.to)return;
  const a=addDays(from,-31),b=addDays(to,62);
  d.loading=true;
  try{
    if(!d.cals.length)await srcLoadCals(S);
    const ids=d.cals.filter(c=>d.show[c.id]!==false).map(c=>c.rawId);
    let list=[];
    if(ids.length){const r=await S.P().listEventsInRange({from:a.getTime(),to:b.getTime(),calendarIds:ids});list=(r&&r.result)||[];}
    const by=new Map();
    for(const inst of list){
      const key=S.instPfx+inst.id+"|"+inst.startDate;
      inst._key=key;
      inst._ev={id:key,title:inst.title,cal:S.calPfx+inst.calendarId,location:inst.location||"",repeat:inst.isPartOfSeries?"series":"none",
        remind:S.key==="dav"?normRem(inst.alarms||[]):normRem((Array.isArray(inst.alerts)?inst.alerts:[]).map(a=>-a))};
      inst._color=S.colorOf(inst);
      by.set(key,inst);
    }
    d.events=list;d.byKey=by;d.error=null;
  }catch(e){if(e&&e.needAuth){d.needAuth=true;d.error=null;}else d.error="Termine konnten nicht geladen werden: "+errText(e);}
  d.from=a;d.to=b;d.loading=false;
  render();
}
function instRange(inst){
  let a,b;
  if(inst.isAllDay){const x=new Date(inst.startDate),y=new Date(inst.endDate);a=new Date(x.getUTCFullYear(),x.getUTCMonth(),x.getUTCDate());b=new Date(y.getUTCFullYear(),y.getUTCMonth(),y.getUTCDate());if(b<=a)b=addDays(a,1);}
  else{a=new Date(inst.startDate);b=new Date(inst.endDate);if(b<=a)b=new Date(a.getTime()+30*60000);}
  return [a,b];
}
function srcToEv(S,inst){
  const [s,b]=instRange(inst);
  const e=inst.isAllDay?addDays(b,-1):b;
  return {id:inst._key,title:inst.title||"",allDay:!!inst.isAllDay,start:toLocal(s),end:toLocal(e<s?s:e),cal:S.calPfx+inst.calendarId,location:inst.location||"",notes:inst.description||"",repeat:"none",remind:inst._ev?inst._ev.remind:null,device:inst,src:S,series:!!inst.isPartOfSeries};
}
function devOpts(ev){
  const s=parseLocal(ev.start),e=parseLocal(ev.end);
  const o={title:ev.title||"Ohne Titel",location:ev.location||"",description:ev.notes||"",isAllDay:!!ev.allDay};
  if(ev.allDay){o.startDate=startOfDay(s).getTime();o.endDate=startOfDay(e<s?s:e).getTime();}
  else{o.startDate=s.getTime();o.endDate=(e>s?e:new Date(s.getTime()+3600000)).getTime();}
  if(ev.repeat&&ev.repeat!=="none"&&REP[ev.repeat]){o.recurrence={frequency:ev.repeat,interval:1};if(ev.until)o.recurrence.end=addDays(parseLocal(ev.until),1).getTime()-1;}
  if(ev.remind!==undefined){const r=normRem(toList(ev.remind));o.alarms=r;o.alerts=r.map(m=>-m);}
  return o;
}
function authMsg(S){return S.key==="dav"?"Anmeldung beim CalDAV-Server fehlgeschlagen – bitte Zugangsdaten prüfen.":"Google-Anmeldung abgelaufen – bitte links erneut anmelden und nochmal speichern.";}
async function deviceSave(old,out){
  const tS=srcOfCal(out.cal),oS=old&&old.device?old.src:null;
  const tgt=tS?out.cal.slice(tS.calPfx.length):null;
  if((tS&&!tS.P())||(oS&&!oS.P())){toast("Dieses Konto ist hier nicht verfügbar.");return;}
  const o=devOpts(out);
  let errS=tS||oS;
  try{
    if(oS){
      const inst=old.device,P=oS.P();
      if(tS===oS&&tgt===String(inst.calendarId)){
        if(old.series)await P.modifyEvent({id:String(inst.masterId||inst.id),title:o.title,location:o.location,description:o.description,alarms:o.alarms,alerts:o.alerts});
        else await P.modifyEvent(Object.assign({id:String(inst.id)},o));
        if(out.travel!==undefined)travelMapSet(oS,inst.masterId||inst.id,out.travel);
      }else{
        if(old.series){toast("Serien können nicht verschoben werden.");return;}
        if(tS){const r=await tS.P().createEvent(Object.assign({calendarId:tgt},o));if(r&&r.id&&out.travel!==undefined)travelMapSet(tS,r.id,out.travel);}
        else saveEvent(Object.assign({},out,{id:uid(),created:Date.now(),updated:Date.now()}));
        errS=oS;
        await P.deleteEvent({id:String(inst.id),span:0});
      }
      toast(`Gesichert in „${calOf(tS?out.cal:old.cal).name}“`);
    }else{
      const r=await tS.P().createEvent(Object.assign({calendarId:tgt},o));
      if(r&&r.id&&out.travel!==undefined)travelMapSet(tS,r.id,out.travel);
      if(old)deleteEvent(old.id);
      toast(`Eingetragen in „${calOf(out.cal).name}“`);
    }
  }catch(e){if(e&&e.needAuth){errS.st.needAuth=true;toast(authMsg(errS));}else toast((errS?errS.label():"Konto")+": "+errText(e));}
  srcReload();
}
function askDeleteDevice(old){
  const inst=old.device,S=old.src;
  openModal(`<div class="sheet"><div class="sheet-head"><span></span><h3>„${esc(old.title||"Ohne Titel")}“ löschen?</h3><span></span></div>
    <p class="hint">Der Termin wird auch in „${esc(calOf(old.cal).name)}“ gelöscht.</p><div class="choice">
    ${old.series?`<button class="red" data-del="one">Nur diesen Termin</button><button class="red" data-del="all">Ganze Serie löschen</button>`:`<button class="red" data-del="one">Löschen</button>`}

function calOptionLabel(c){const S=srcOfCal(c.id);return esc(c.name)+(c.account&&c.account!==c.name?" – "+esc(c.account):"")+(S&&srcList().filter(x=>x.st.enabled).length>1?" ("+esc(S.title())+")":"");}
function devMigrate(){
  const targets=allWritable();
  if(!targets.length){toast("Kein beschreibbarer Kalender gefunden.");return;}
  const n=state.events.size;
  openModal(`<div class="sheet"><div class="sheet-head"><button class="link" data-close>Abbrechen</button><h3>Termine übertragen</h3><span style="width:60px"></span></div>
    <p class="hint">Deine ${n} Tagwerk-Termine werden in das gewählte Konto kopiert und danach aus Tagwerk entfernt. So sind sie überall synchronisiert. Ausgelassene Einzeltermine einer Serie werden dabei nicht übernommen.</p>
    <div class="group"><div class="row"><span>Ziel</span><select id="m-tgt">${targets.map(c=>`<option value="${esc(c.id)}">${calOptionLabel(c)}</option>`).join("")}</select></div></div>
    <div class="choice"><button id="m-go" style="color:var(--accent)">${n} Termine übertragen</button></div></div>`);
  $("#m-go",modal).onclick=async()=>{
    const id=$("#m-tgt",modal).value,S=srcOfCal(id),tgt=id.slice(S.calPfx.length);closeModal();
    const P=S.P();let ok=0,fail=0;
    toast("Übertrage…");
    for(const ev of [...state.events.values()]){

  if(!L||N.perm!=="granted")return;
  const list=[];
  if(N.remind)for(const o of occ){
    const S=srcOfInst(o.ev.id);
    if(S&&S.key==="dev"&&!N.devToo)continue; /* sonst übernimmt die Kalender-App des Kontos */
    const rs=S?normRem(o.ev.remind):effRemind(o.ev);
    const when=o.allDay?`${relDay(o.start)} · ganztägig`:`${relDay(o.start)} um ${hm(o.start)} Uhr`;
    const loc=o.ev.location?` · ${o.ev.location}`:"";
    for(const r of rs){
      const at=o.start.getTime()-r*60000;
      if(at<Date.now()+5000||at>to.getTime())continue;
      list.push({id:hashId("r|"+o.key+"|"+r),title:o.title,body:when+loc,schedule:{at:new Date(at),allowWhileIdle:true},channelId:"erinnerungen",smallIcon:"ic_stat_tagwerk",iconColor:"#D4552C",extra:{date:ymd(o.start)},isExactNotification:!!N.exact,autoCancel:true});
    }
  }
  if(N.remind)for(const o of occ){
    if(o.allDay||!o.ev.location)continue;
    const S=srcOfInst(o.ev.id);
    const on=S?travelFlag(S,S.st.byKey.get(o.ev.id)):effTravel(o.ev);
    if(!on||o.start.getTime()<Date.now())continue;
    const t=travelCached(o.ev.location);
    if(!t||t.err)continue;
    const at=o.start.getTime()-t.rounded*60000;
    if(at<Date.now()+5000||at>to.getTime())continue;
    list.push({id:hashId("t|"+o.key),title:"🚗 Zeit zum Losfahren: "+o.title,body:`Fahrzeit ca. ${fmtMin(t.min)} · Termin ${relDay(o.start).toLowerCase()==="heute"?"":relDay(o.start)+" "}um ${hm(o.start)} Uhr · ${o.ev.location}`,schedule:{at:new Date(at),allowWhileIdle:true},channelId:"erinnerungen",smallIcon:"ic_stat_tagwerk",iconColor:"#D4552C",extra:{date:ymd(o.start)},isExactNotification:!!N.exact,autoCancel:true});
  }
  if(N.daily){
    const [hh,mm]=String(N.dailyAt||"07:00").split(":").map(Number);
    for(let i=0;i<14;i++){
      const d=addDays(from,i),at=new Date(d.getFullYear(),d.getMonth(),d.getDate(),hh||0,mm||0);
      if(at<=now)continue;
      const day=byDay(occ,d,1)[0].filter(o=>o.allDay||sameDay(o.start,d));
      if(!day.length)continue;
      const lines=day.map(o=>`${o.allDay?"ganztägig":hm(o.start)}  ${o.title}`);
      list.push({id:hashId("d|"+ymd(d)),title:day.length===1?`Heute: ${day[0].title}`:`Heute: ${day.length} Termine`,body:lines.slice(0,3).join(" · ")+(lines.length>3?" …":""),largeBody:lines.join("\n"),
        schedule:{at,allowWhileIdle:true},channelId:"tagesuebersicht",smallIcon:"ic_stat_tagwerk",iconColor:"#D4552C",extra:{date:ymd(d)},isExactNotification:!!N.exact,autoCancel:true});
    }
  }
  list.sort((a,b)=>a.schedule.at-b.schedule.at);
  if(list.length>400)list.length=400;
  const sig=JSON.stringify(list.map(n=>[n.id,+n.schedule.at,n.title,n.body]));
  if(sig===_planSig)return;
  _planBusy=true;

    const pend=await L.getPending();
    const ids=(pend&&pend.notifications||[]).filter(n=>+n.id!==TEST_ID&&+n.id!==TEST_ID-1).map(n=>({id:n.id}));
    if(ids.length)await L.cancel({notifications:ids});
    if(list.length)await L.schedule({notifications:list});
    _planSig=sig;
    N.planned=list.length;N.next=list[0]?{at:+list[0].schedule.at,title:list[0].title}:null;N.lastError=null;
  }catch(e){N.lastError=errText(e);console.warn("Benachrichtigungen:",e);}

}

async function httpJson(url){
  const N=nativePlugin("DavHttp");
  if(N){
    const r=await N.request({url,method:"GET",headers:{"Accept":"application/json","User-Agent":"Tagwerk-Kalender/1.0 (+https://github.com/plange-dev/tagwerk)"}});
    if(r.status!==200)throw new Error("Kartendienst antwortet mit HTTP "+r.status);

  }

let geoQueue=Promise.resolve(),lastGeo=0;
function geocode(q){
  const k=q.trim().toLowerCase(),c=geoCache[k];
  if(c&&Date.now()-c.t<90*DAY)return Promise.resolve(c.ll);
  const p=geoQueue.then(async()=>{
    const wait=1100-(Date.now()-lastGeo);if(wait>0)await sleep(wait);lastGeo=Date.now();
    const j=await httpJson("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=de&q="+encodeURIComponent(q));
    const ll=Array.isArray(j)&&j[0]?[+j[0].lat,+j[0].lon]:null;
    geoCache[k]={ll,t:Date.now()};lsSet("tagwerk:geo",geoCache);
    return ll;
  });
  geoQueue=p.catch(()=>{});
  return p;
}
const PROFILE={car:"routed-car",bike:"routed-bike",foot:"routed-foot"};
async function routeMin(a,b,mode){
  const k=mode+"|"+a.map(x=>x.toFixed(4))+"|"+b.map(x=>x.toFixed(4)),c=routeCache[k];

  let j;
  try{j=await httpJson(`https://routing.openstreetmap.de/${PROFILE[mode]||PROFILE.car}/route/v1/driving/${coords}?overview=false`);}
  catch(e){if(mode!=="car")throw e;j=await httpJson(`https://router.project-osrm.org/route/v1/driving/${coords}?overview=false`);}
  if(!j||j.code!=="Ok"||!j.routes||!j.routes[0])throw new Error("Keine Route gefunden.");
  const m=Math.max(1,Math.round(j.routes[0].duration/60));

}
function getPos(){

    navigator.geolocation.getCurrentPosition(p=>{state.travel.pos=[p.coords.latitude,p.coords.longitude];res(state.travel.pos);},()=>res(state.travel.pos),{enableHighAccuracy:false,timeout:15000,maximumAge:15*60000});

async function originLL(){

function travelCached(dest){

}

/* ---------- Import (.ics / .zip aus Google, Outlook, Nextcloud, Apple …) ---------- */
async function unzipIcs(buf){
  const dv=new DataView(buf);let eocd=-1;
  for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-65557);i--)if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;}
  if(eocd<0)throw new Error("Die ZIP-Datei ist beschädigt.");
  const n=dv.getUint16(eocd+10,true);let off=dv.getUint32(eocd+16,true);const out=[];
  for(let k=0;k<n;k++){
    if(dv.getUint32(off,true)!==0x02014b50)break;
    const method=dv.getUint16(off+10,true),csize=dv.getUint32(off+20,true),nlen=dv.getUint16(off+28,true),elen=dv.getUint16(off+30,true),clen=dv.getUint16(off+32,true),lho=dv.getUint32(off+42,true);
    const name=new TextDecoder().decode(new Uint8Array(buf,off+46,nlen));off+=46+nlen+elen+clen;
    if(!/\.ics$/i.test(name))continue;
    const ln=dv.getUint16(lho+26,true),le=dv.getUint16(lho+28,true),data=new Uint8Array(buf,lho+30+ln+le,csize);
    let bytes;
    if(method===0)bytes=data;
    else if(method===8){
      if(typeof DecompressionStream==="undefined")throw new Error("Dieser Browser kann keine ZIP-Dateien entpacken – bitte die .ics-Dateien einzeln wählen.");
      bytes=new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer());
    }else continue;
    out.push({name:name.split("/").pop(),text:new TextDecoder().decode(bytes)});
  }
  return out;
}
/* Rohe Blöcke für verlustfreien Import nach CalDAV */
function icsBlocks(text){
  const lines=DavCal.ics.unfold(text).split(/\r?\n/);
  const tz=[],ev=new Map();let cur=null,kind=null,depth=0,uidv=null;
  for(const l of lines){
    if(!cur){
      if(/^BEGIN:(VEVENT|VTIMEZONE)$/i.test(l)){kind=l.slice(6).toUpperCase();cur=[l];depth=0;uidv=null;}
      continue;
    }
    cur.push(l);
    if(/^BEGIN:/i.test(l)){depth++;continue;}
    if(/^END:/i.test(l)){
      if(depth===0){
        if(kind==="VTIMEZONE")tz.push(cur);else{const k=uidv||("tagwerk-"+uid());if(!ev.has(k))ev.set(k,[]);ev.get(k).push(cur);}
        cur=null;continue;
      }
      depth--;continue;
    }
    if(depth===0&&kind==="VEVENT"&&/^UID[:;]/i.test(l))uidv=DavCal.ics.parseLine(l).value.trim();
  }
  return {tz,ev};
}
/* Wiederholungsregeln (RFC 5545, gängige Teilmenge) */
const WDC={MO:0,TU:1,WE:2,TH:3,FR:4,SA:5,SU:6};
function parseRule(v){
  const p={};String(v).split(";").forEach(x=>{const i=x.indexOf("=");if(i>0)p[x.slice(0,i).toUpperCase()]=x.slice(i+1);});
  const byday=p.BYDAY?p.BYDAY.split(",").map(x=>{const m=x.match(/^([+-]?\d+)?(MO|TU|WE|TH|FR|SA|SU)$/i);return m?{n:m[1]?+m[1]:0,wd:WDC[m[2].toUpperCase()]}:null;}).filter(Boolean):null;
  const until=p.UNTIL?DavCal.ics.parseDate({value:p.UNTIL,params:{}}):null;
  return {freq:p.FREQ,interval:Math.max(1,+(p.INTERVAL||1)),count:p.COUNT?+p.COUNT:null,until:until?until.ms:null,byday,
    bymonthday:p.BYMONTHDAY?p.BYMONTHDAY.split(",").map(Number):null,bymonth:p.BYMONTH?p.BYMONTH.split(",").map(Number):null,
    other:Object.keys(p).some(k=>!["FREQ","INTERVAL","COUNT","UNTIL","BYDAY","BYMONTHDAY","BYMONTH","WKST"].includes(k))};
}
function nthWeekday(y,m,wd,n){
  if(n>0){const f=new Date(y,m,1);const d=1+((wd-wdIndex(f)+7)%7)+(n-1)*7;const r=new Date(y,m,d);return r.getMonth()===m?r:null;}
  const l=new Date(y,m+1,0);const d=l.getDate()-((wdIndex(l)-wd+7)%7)+(n+1)*7;const r=new Date(y,m,d);return d>0&&r.getMonth()===m?r:null;
}
function expandRule(startMs,R,horizon,exset){
  const b=new Date(startMs),H=b.getHours(),M=b.getMinutes(),out=[];let n=0;
  const at=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate(),H,M);
  const monthDays=(y,m)=>{
    if(R.bymonthday)return R.bymonthday.map(x=>{const last=new Date(y,m+1,0).getDate();const d=x>0?x:last+1+x;return d>=1&&d<=last?new Date(y,m,d):null;}).filter(Boolean);
    if(R.byday){const r=[];for(const {n:nn,wd} of R.byday){if(nn)r.push(nthWeekday(y,m,wd,nn));else for(let i=1;i<=5;i++)r.push(nthWeekday(y,m,wd,i));}return r.filter(Boolean);}
    const d=new Date(y,m,b.getDate());return d.getMonth()===m?[d]:[];
  };
  for(let i=0;i<3000;i++){
    let c=[];
    if(R.freq==="DAILY")c=[addDays(b,i*R.interval)];
    else if(R.freq==="WEEKLY"){const ws=addDays(startOfWeek(b),i*7*R.interval);c=(R.byday&&R.byday.length?R.byday.map(x=>x.wd):[wdIndex(b)]).map(wd=>addDays(ws,wd));}
    else if(R.freq==="MONTHLY"){const t=new Date(b.getFullYear(),b.getMonth()+i*R.interval,1);c=monthDays(t.getFullYear(),t.getMonth());}
    else if(R.freq==="YEARLY"){const y=b.getFullYear()+i*R.interval;for(const m of (R.bymonth||[b.getMonth()+1]))c.push(...(R.bymonthday||R.byday?monthDays(y,m-1):[new Date(y,m-1,b.getDate())].filter(d=>d.getMonth()===m-1)));}
    else return out;
    c=c.map(at).sort((x,y)=>x-y);
    let any=false;
    for(const d of c){
      const ms=d.getTime();if(ms<startMs)continue;
      if(R.until!=null&&ms>R.until)return out;
      n++;if(R.count&&n>R.count)return out;
      if(ms>horizon)return out;
      any=true;if(!exset.has(ms))out.push(ms);
    }
    if(!c.length&&R.freq==="DAILY")return out;
  }
  return out;
}
function isSimpleRule(R,startMs){
  if(!R||R.other||R.interval!==1||!["DAILY","WEEKLY","MONTHLY","YEARLY"].includes(R.freq))return false;
  const b=new Date(startMs);
  if(R.byday&&!(R.freq==="WEEKLY"&&R.byday.length===1&&!R.byday[0].n&&R.byday[0].wd===wdIndex(b)))return false;
  if(R.bymonthday&&!(R.bymonthday.length===1&&R.bymonthday[0]===b.getDate()))return false;
  if(R.bymonth&&!(R.bymonth.length===1&&R.bymonth[0]===b.getMonth()+1))return false;
  return true;
}
const FREQ_REP={DAILY:"daily",WEEKLY:"weekly",MONTHLY:"monthly",YEARLY:"yearly"};
function parseImport(files){
  const I=DavCal.ics,items=[],cals=new Set();let raw=[];
  for(const f of files){
    const calName=((I.unfold(f.text).match(/^X-WR-CALNAME:(.*)$/mi)||[])[1]||f.name.replace(/\.ics$/i,"")).trim();
    cals.add(calName);
    raw.push({calName,blocks:icsBlocks(f.text)});
    for(const v of I.vevents(f.text)){
      const g=n=>{const p=v.g(n);return p?I.unesc(p.value):"";};
      if(/^CANCELLED$/i.test(g("STATUS")))continue;
      const ds=v.g("DTSTART");if(!ds)continue;
      const st=I.parseDate(ds);if(!st)continue;
      const de=v.g("DTEND");let en=de?I.parseDate(de):null;
      let s0=st.allDay?(()=>{const x=new Date(st.ms);return new Date(x.getUTCFullYear(),x.getUTCMonth(),x.getUTCDate()).getTime();})():st.ms;
      let e0;
      if(en)e0=st.allDay?(()=>{const x=new Date(en.ms);return new Date(x.getUTCFullYear(),x.getUTCMonth(),x.getUTCDate()).getTime();})():en.ms;
      else if(v.g("DURATION"))e0=s0+I.durMs(v.g("DURATION").value);
      else e0=st.allDay?addDays(new Date(s0),1).getTime():s0+3600000;
      if(e0<=s0)e0=st.allDay?addDays(new Date(s0),1).getTime():s0+30*60000;
      const ex=[];for(const x of v.all("EXDATE"))for(const val of x.value.split(",")){const d=I.parseDate({value:val,params:x.params});if(d)ex.push(d.allDay?(()=>{const y=new Date(d.ms);return new Date(y.getUTCFullYear(),y.getUTCMonth(),y.getUTCDate()).getTime();})():d.ms);}
      const rid=v.g("RECURRENCE-ID");
      items.push({uid:g("UID")||("tagwerk-"+uid()),calName,title:g("SUMMARY")||"Ohne Titel",location:g("LOCATION"),notes:g("DESCRIPTION"),allDay:st.allDay,s:s0,e:e0,
        rule:v.g("RRULE")?parseRule(v.g("RRULE").value):null,exdates:ex,
        recurId:rid?(()=>{const d=I.parseDate(rid);return d?(d.allDay?(()=>{const y=new Date(d.ms);return new Date(y.getUTCFullYear(),y.getUTCMonth(),y.getUTCDate()).getTime();})():d.ms):null;})():null,
        alarms:v.alarms||[]});
    }
  }
  return {items,cals:[...cals],raw};
}
/* Endet ein Eintrag (bzw. die Serie) vor „von“? */
function itemLast(it,horizon){
  if(!it.rule)return it.e;
  if(it.rule.until==null&&!it.rule.count)return Infinity;
  const occ=expandRule(it.s,it.rule,horizon,new Set());
  return occ.length?occ[occ.length-1]+(it.e-it.s):it.e;
}
function planImport(P,onlyFuture,richSeries){
  const today=today0().getTime(),horizon=addDays(today0(),730).getTime();
  const masters=P.items.filter(i=>i.recurId==null),overrides=P.items.filter(i=>i.recurId!=null);
  const ovByUid=new Map();for(const o of overrides){if(!ovByUid.has(o.uid))ovByUid.set(o.uid,[]);ovByUid.get(o.uid).push(o);}
  const out=[];let skippedPast=0,expanded=0;
  const mk=(it,s,e,extra)=>({uid:it.uid,title:it.title,location:it.location,notes:it.notes,allDay:it.allDay,s,e,alarms:it.alarms,...extra});
  for(const it of masters){
    const ov=ovByUid.get(it.uid)||[];
    if(!it.rule){if(onlyFuture&&it.e<today){skippedPast++;continue;}out.push(mk(it,it.s,it.e,{}));continue;}
    if(onlyFuture&&itemLast(it,horizon)<today){skippedPast++;continue;}
    const exset=new Set([...it.exdates,...ov.map(o=>o.recurId)]);
    const simple=isSimpleRule(it.rule,it.s)&&(richSeries||(!it.exdates.length&&!ov.length));
    if(simple){
      let untilMs=it.rule.until;
      if(it.rule.count){const occ=expandRule(it.s,it.rule,Infinity,new Set());untilMs=occ.length?occ[occ.length-1]:it.s;}
      out.push(mk(it,it.s,it.e,{repeat:FREQ_REP[it.rule.freq],until:untilMs!=null?ymd(new Date(untilMs)):"",exdates:[...exset].map(ms=>ymd(new Date(ms)))}));
    }else{
      const from=onlyFuture?today:-Infinity,dur=it.e-it.s;
      const occ=expandRule(it.s,it.rule,horizon,exset).filter(ms=>ms+dur>=from).slice(0,730);
      occ.forEach((ms,i)=>out.push(mk(it,ms,ms+dur,{uid:it.uid+"#"+i})));
      expanded++;
    }
  }
  for(const o of overrides){if(onlyFuture&&o.e<today){continue;}out.push(mk(o,o.s,o.e,{uid:o.uid+"@"+o.recurId}));}
  return {list:out,skippedPast,expanded,series:masters.filter(m=>m.rule).length};
}

function impToEv(x,cal){
  const s=new Date(x.s),e=x.allDay?addDays(new Date(x.e),-1):new Date(x.e);
  const ev={id:uid(),uid:x.uid,title:x.title,allDay:x.allDay,start:toLocal(s),end:toLocal(e<s?s:e),cal,repeat:x.repeat||"none",until:x.until||"",location:x.location||"",notes:x.notes||"",exdates:x.exdates||[],created:Date.now(),updated:Date.now()};
  if(x.alarms&&x.alarms.length)ev.remind=normRem(x.alarms);
  return ev;
}
function importLocal(pl,cal){
  const have=new Set([...state.events.values()].map(e=>e.uid).filter(Boolean));
  const list=[];let dup=0;
  for(const x of pl.list){if(have.has(x.uid)){dup++;continue;}have.add(x.uid);list.push(impToEv(x,cal));}
  saveEventsBulk(list);
  toast(`${list.length} Termine importiert${dup?`, ${dup} schon vorhanden`:""}${pl.skippedPast?`, ${pl.skippedPast} vergangene ausgelassen`:""}`);
}
async function importToSource(pl,S,calId){
  const P=S.P();let ok=0,fail=0,i=0;
  for(const x of pl.list){
    i++;if(i%10===1)toast(`Importiere ${i}/${pl.list.length} …`);
    const ev=impToEv(x,"");
    try{
      const r=await P.createEvent(Object.assign({calendarId:calId},devOpts(ev)));ok++;
      /* Ausnahmen einer Serie: einzelne Vorkommen wieder entfernen (Android-Kalender) */
      if(r&&r.id&&x.repeat&&x.exdates&&x.exdates.length){
        const t=new Date(x.s);
        for(const d of x.exdates){const dd=parseLocal(d);const inst=new Date(dd.getFullYear(),dd.getMonth(),dd.getDate(),t.getHours(),t.getMinutes());
          try{await P.deleteEvent({id:String(r.id),span:0,instanceDate:x.allDay?Date.UTC(dd.getFullYear(),dd.getMonth(),dd.getDate()):inst.getTime()});}catch(e){}}
      }
    }
    catch(e){if(e&&e.needAuth){S.st.needAuth=true;toast(authMsg(S));break;}fail++;}
  }
  toast(`${ok} Termine importiert${fail?`, ${fail} fehlgeschlagen`:""}`);
  srcReload(S);
}
async function importToDav(P,calId,onlyFuture){
  const today=today0().getTime(),horizon=addDays(today0(),730).getTime();
  const lastByUid=new Map();
  for(const it of P.items){const l=it.recurId==null?itemLast(it,horizon):it.e;lastByUid.set(it.uid,Math.max(lastByUid.get(it.uid)||-Infinity,l));}
  let ok=0,dup=0,fail=0,past=0,n=0;
  const total=P.raw.reduce((a,r)=>a+r.blocks.ev.size,0);
  for(const r of P.raw){
    for(const [u,blocks] of r.blocks.ev){
      n++;if(n%10===1)toast(`Importiere ${n}/${total} …`);
      if(onlyFuture&&(lastByUid.get(u)??Infinity)<today){past++;continue;}
      if(blocks.every(bl=>bl.some(l=>/^STATUS:CANCELLED$/i.test(l))))continue;
      const lines=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Tagwerk//Import//DE",...r.blocks.tz.flat(),...blocks.flat(),"END:VCALENDAR"];
      try{const res=await DavCal.importRaw(calId,u,DavCal.ics.join(lines));if(res==="exists")dup++;else ok++;}
      catch(e){if(e&&e.needAuth){SOURCES.dav.st.needAuth=true;toast(authMsg(SOURCES.dav));srcReload(SOURCES.dav);return;}fail++;}
    }
  }
  toast(`${ok} Termine importiert${dup?`, ${dup} schon vorhanden`:""}${past?`, ${past} vergangene ausgelassen`:""}${fail?`, ${fail} fehlgeschlagen`:""}`);
  srcReload(SOURCES.dav);
}

/* ---------- Export (.ics für Google, Outlook, Apple, Nextcloud …) ---------- */
function exportUid(ev){return ev.uid&&!/[#@]\d+$/.test(ev.uid)?ev.uid:(ev.uid||ev.id)+"@tagwerk";}
function evToOpts(ev){return devOpts(Object.assign({},ev,{remind:ev.remind===undefined?effRemind(ev):ev.remind}));}
function buildExportIcs(evs,calName){
  const I=DavCal.ics,lines=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Tagwerk//Kalender//DE","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:"+String(calName).replace(/[\r\n]/g," ")];
  const body=[];let tz=null;
  for(const ev of evs){const r=I.veventLines(exportUid(ev),evToOpts(ev),ev.exdates);if(r.tzi&&!tz)tz=r.tzi;body.push(...r.lines);}
  if(tz)lines.push(...tz.vt);
  lines.push(...body,"END:VCALENDAR");
  return I.join(lines);
}
/* Termine aus Konten für den Export holen (als Einzeltermine) */
async function fetchSourceEvents(S,rawIds,from,to){
  if(!rawIds.length)return [];
  const r=await S.P().listEventsInRange({from:from.getTime(),to:to.getTime(),calendarIds:rawIds});
  return ((r&&r.result)||[]).map(inst=>{
    const [a,b]=instRange(inst),e=inst.isAllDay?addDays(b,-1):b;
    const rem=S.key==="dav"?normRem(inst.alarms||[]):normRem((inst.alerts||[]).map(x=>-x));
    return {id:S.key+"-"+inst.id+"-"+inst.startDate,uid:(S.key+"-"+String(inst.id).replace(/[^A-Za-z0-9._-]/g,"_")+"-"+inst.startDate+"@tagwerk"),
      title:inst.title||"Ohne Titel",allDay:!!inst.isAllDay,start:toLocal(a),end:toLocal(e<a?a:e),location:inst.location||"",notes:inst.description||"",repeat:"none",exdates:[],remind:rem};
  });
}

name: Android-App bauen

on:
  push:
    branches: [main, nightly]
  workflow_dispatch:

permissions:
  contents: write

# Pro Branch nacheinander bauen, damit Versionsnummern nicht doppelt vergeben werden
concurrency:
  group: android-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Versionierung je Branch:
      #  nightly: eigener Zähler (Tags nightly-1.0.N), jede Nightly-Version +1, Start bei 1.0.25
      #  main:    letzter Release (Tags v1.0.N) +1, aber nie höher als die neueste Nightly-Version
      - name: Versionsnummer bestimmen
        id: ver
        run: |
          git fetch --tags --force --quiet
          NMAX=$(git tag -l 'nightly-1.0.*' | sed 's/^nightly-1\.0\.//' | grep -E '^[0-9]+$' | sort -n | tail -1)
          NMAX=${NMAX:-25}
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            LAST=$(git tag -l 'v1.0.*' | sed 's/^v1\.0\.//' | grep -E '^[0-9]+$' | sort -n | tail -1)
            LAST=${LAST:-0}
            NEXT=$((LAST+1))
            if [ "$NEXT" -gt "$NMAX" ]; then
              echo "::notice::Release würde Nightly ($NMAX) überholen – Nummer bleibt bei $NMAX"
              NEXT=$NMAX
            fi
            TAG="v1.0.$NEXT"
          else
            NEXT=$((NMAX+1))
            TAG="nightly-1.0.$NEXT"
          fi
          echo "version=1.0.$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Version: 1.0.$NEXT ($GITHUB_REF_NAME)"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Versionsangabe in die App schreiben
        run: |
          echo "{\"version\":\"${{ steps.ver.outputs.version }}\",\"channel\":\"${{ github.ref_name }}\",\"commit\":\"${GITHUB_SHA::7}\",\"date\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"platform\":\"android\"}" > www/version.json
          cat www/version.json

      - name: Web-App in das Android-Projekt kopieren
        run: npx cap sync android

      - name: APK bauen
        working-directory: android
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          chmod +x gradlew
          # Maven Central lehnt bei Andrang gelegentlich ab (HTTP 429) – dann bis zu 3 Versuche
          for i in 1 2 3; do
            ./gradlew assembleDebug --no-daemon && exit 0
            echo "Build-Versuch $i fehlgeschlagen – neuer Versuch in $((i*60)) s"; sleep $((i*60))
          done
          exit 1

      - name: APK bereitstellen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Tagwerk.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Tagwerk-APK-${{ github.ref_name }}-${{ steps.ver.outputs.version }}
          path: Tagwerk.apk

      - name: Nightly-Version markieren
        if: github.ref == 'refs/heads/nightly'
        run: |
          git tag "${{ steps.ver.outputs.tag }}" "$GITHUB_SHA"
          git push origin "${{ steps.ver.outputs.tag }}"

      - name: Als Release veröffentlichen (nur main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Tagwerk ${{ steps.ver.outputs.version }}
          body: |
            **Installieren:** `Tagwerk.apk` auf dem Android-Handy herunterladen und öffnen.
            Beim ersten Mal fragt Android, ob du Apps aus dieser Quelle erlauben willst – einmal bestätigen.
          files: Tagwerk.apk
          make_latest: true

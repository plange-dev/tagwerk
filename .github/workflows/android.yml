name: Android-App bauen

on:
  push:
    branches: [main, nightly]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Versionsangabe in die App schreiben
        run: |
          echo "{\"version\":\"1.0.${{ github.run_number }}\",\"channel\":\"${{ github.ref_name }}\",\"commit\":\"${GITHUB_SHA::7}\",\"date\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"platform\":\"android\"}" > www/version.json
          cat www/version.json

      - name: Web-App in das Android-Projekt kopieren
        run: npx cap sync android

      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          # Maven Central lehnt bei Andrang gelegentlich ab (HTTP 429) – dann bis zu 3 Versuche
          for i in 1 2 3; do
            ./gradlew assembleDebug --no-daemon && exit 0
            echo "Build-Versuch $i fehlgeschlagen – neuer Versuch in $((i*60)) s"; sleep $((i*60))
          done
          exit 1

      - name: APK bereitstellen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Tagwerk.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Tagwerk-APK-${{ github.ref_name }}
          path: Tagwerk.apk

      - name: Als Release veröffentlichen (nur main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Tagwerk 1.0.${{ github.run_number }}
          body: |
            **Installieren:** `Tagwerk.apk` auf dem Android-Handy herunterladen und öffnen.
            Beim ersten Mal fragt Android, ob du Apps aus dieser Quelle erlauben willst – einmal bestätigen.
          files: Tagwerk.apk
          make_latest: true

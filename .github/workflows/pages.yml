name: Web-App veröffentlichen (PC & Browser)

on:
  push:
    branches: [main]
    # Reine Doku-Änderungen lösen keinen Build/Release aus
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Die Web-Version wird nur aus main (stabile Version) veröffentlicht
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Versionsangabe in die Web-App schreiben
        run: |
          echo "{\"version\":\"web-${{ github.run_number }}\",\"channel\":\"${{ github.ref_name }}\",\"commit\":\"${GITHUB_SHA::7}\",\"date\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"platform\":\"web\"}" > www/version.json
          cat www/version.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
